[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trikal"
version = "0.1.0"
description = "TRIKAL — point-in-time equity research terminal for Indian equities"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "pdfplumber>=0.11",
    "pyyaml>=6",
    "tzdata>=2024.1",  # IANA zones on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
trikal = "trikal_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["core", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live sources (deselect with -m 'not network')"]
